name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Build, Test & Doc
    runs-on: ubuntu-latest
    container:
      image: ocaml/opam:debian-12-ocaml-5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Workspace Ownership
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install Dependencies
        run: opam install . --deps-only --with-test --with-doc --yes --no-depext

      - name: Build, Test, and Document (Unified Parallel Pass)
        run: opam exec -- dune build @all @runtest @doc

      - name: Upload HTML Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoc-html-docs
          path: _build/default/_doc/_html/
          retention-days: 14
