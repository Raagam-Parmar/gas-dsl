name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - run: opam install . --deps-only --with-test --with-doc --yes

      - run: dune build @all @runtest @doc
